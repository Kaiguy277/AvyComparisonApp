name: CI

# Gate every push and PR on the three checks we run locally: strict
# TypeScript, lint (0 warnings), and the Vitest logic suite. The app is
# iPhone-first and can't be built here, so this covers the pure logic —
# device testing stays manual.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (no warnings)
        run: npx eslint . --ext .ts,.tsx --max-warnings=0

      - name: Test
        run: npm test
